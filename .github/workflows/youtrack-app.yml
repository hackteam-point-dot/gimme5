name: Build and Deploy YouTrack App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    
    defaults:
      run:
        working-directory: ./youtrack-app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Pack app
        run: npm run pack

      - name: Upload to YouTrack
        run: npm run upload -- --host ${{ secrets.YOUTRACK_HOST }} --token ${{ secrets.YOUTRACK_TOKEN }}